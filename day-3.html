<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050508" />
  <meta name="description" content="Memories of Nida and Kabir." />
  <meta property="og:title" content="Nida ❤️ — Memories" />
  <meta property="og:description" content="Some moments stay forever." />
  <title>Day 3 — Memories | Nida ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-layer bg-gradient vignette" aria-hidden="true"></div>

  <main class="page section">
    <div class="container">
      <div class="text-center" style="margin-bottom: 3rem">
        <span class="chapter-tag">Chapter Three</span>
        <h1 class="page-title">Memories</h1>
        <p class="page-subtitle">A few frames that still feel warm.</p>
      </div>

      <div class="memory-stage">
        <article class="memory-item" data-memory>
          <div class="memory-frame">
            <img
              src="assets/images/nida-1.jpg"
              alt="Nida — portrait one"
              loading="lazy"
              data-fallback="That smile..."
              data-parallax="0.12"
            />
          </div>
          <div class="memory-caption">
            <span>Frame 01</span>
            That smile...
          </div>
        </article>

        <article class="memory-item" data-memory>
          <div class="memory-frame">
            <img
              src="assets/images/nida-2.jpg"
              alt="Nida — portrait two"
              loading="lazy"
              data-fallback="A moment I'll always remember."
            />
          </div>
          <div class="memory-caption">
            <span>Frame 02</span>
            A Beauty I'll always remember.
          </div>
        </article>

        <article class="memory-item" data-memory>
          <div class="memory-frame">
            <img
              src="assets/images/couple-1.jpg"
              alt="Kabir and Nida together"
              loading="lazy"
              data-fallback="Us ❤️"
            />
          </div>
          <div class="memory-caption">
            <span>Frame 03</span>
            Us ❤️
          </div>
        </article>

        <article class="memory-item" data-memory>
          <div class="memory-frame">
            <img
              src="assets/images/couple-2.jpg"
              alt="Kabir and Nida — another memory"
              loading="lazy"
              data-fallback="My favorite memories are the ones with you."
            />
          </div>
          <div class="memory-caption">
            <span>Frame 04</span>
            My favorite Picture are the ones.
          </div>
        </article>
      </div>

      <p class="memory-closing" data-scroll="blur">
        Some memories become permanent residents of the heart.
      </p>

      <p class="closing-note text-center">Made with love, by Kabir.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const { bootCommon, $$, prefersReducedMotion } = window.birthdayUtils;
      bootCommon({ count: 40, hearts: true, speed: 0.25 });

      if (window.gsap && window.ScrollTrigger && !prefersReducedMotion()) {
        gsap.registerPlugin(ScrollTrigger);

        $$("[data-memory]").forEach((item) => {
          const img = item.querySelector("img");
          const caption = item.querySelector(".memory-caption");

          gsap.set(item, { opacity: 1 });

          const tl = gsap.timeline({
            scrollTrigger: {
              trigger: item,
              start: "top 80%",
              end: "bottom 40%",
              toggleActions: "play none none none",
            },
          });

          tl.fromTo(
            item,
            { opacity: 0, y: 60 },
            { opacity: 1, y: 0, duration: 1.1, ease: "power2.out" }
          );

          if (img) {
            gsap.fromTo(
              img,
              { scale: 1.18 },
              {
                scale: 1,
                ease: "none",
                scrollTrigger: {
                  trigger: item,
                  start: "top bottom",
                  end: "bottom top",
                  scrub: true,
                },
              }
            );
          }

          if (caption) {
            tl.fromTo(
              caption,
              { opacity: 0, x: 20 },
              { opacity: 1, x: 0, duration: 0.8 },
              "-=0.5"
            );
          }
        });

        window.anim?.initScrollAnimations?.();
      } else {
        $$("[data-memory]").forEach((item) => {
          item.style.opacity = "1";
        });
      }
    });
  </script>
</body>
</html>
