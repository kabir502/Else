<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050508" />
  <meta name="description" content="Things Kabir loves about Nida." />
  <meta property="og:title" content="Nida ❤️ — Things I Love About You" />
  <meta property="og:description" content="A few things worth saying out loud." />
  <title>Day 2 — Things I Love About You | Nida ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-layer bg-gradient vignette" aria-hidden="true"></div>

  <main class="page section">
    <div class="container-wide">
      <div class="text-center">
        <span class="chapter-tag">Chapter Two</span>
        <h1 class="page-title">Things I Love About You</h1>
        <p class="page-subtitle">Tap each card — some things are better revealed slowly.</p>
      </div>

      <div class="cards-grid" id="cards-grid" aria-label="Compliment cards"></div>

      <p class="final-compliment" id="final-compliment">
        And somehow, even these words aren't enough.
      </p>

      <p class="closing-note text-center" style="margin-top:2rem">Made with love, by Kabir.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const { bootCommon, $, prefersReducedMotion } = window.birthdayUtils;
      bootCommon({ count: 45, hearts: true });

      const compliments = [
        "Your smile",
        "Your eyes",
        "The way you talk",
        "Your kindness",
        "Your little habits",
        "Your laugh",
        "The way you make ordinary moments special",
        "The person you are",
        "The way you care",
        "How safe I feel with you",
        "Your quiet strength",
        "Simply... you.",
      ];

      const grid = $("#cards-grid");
      let flipped = 0;

      compliments.forEach((text, i) => {
        const card = document.createElement("div");
        card.className = "compliment-card";
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.setAttribute("aria-label", `Reveal compliment ${i + 1}`);
        card.innerHTML = `
          <div class="compliment-card__inner">
            <div class="compliment-card__face compliment-card__front">Reveal</div>
            <div class="compliment-card__face compliment-card__back">${text}</div>
          </div>
        `;

        const flip = () => {
          if (card.classList.contains("is-flipped")) return;
          card.classList.add("is-flipped");
          flipped += 1;

          const rect = card.getBoundingClientRect();
          window.spawnHeartBurst?.(rect.left + rect.width / 2, rect.top + rect.height / 2, 8);

          if (window.gsap) {
            gsap.fromTo(
              card,
              { rotateY: -8 },
              { rotateY: 0, duration: 0.4, ease: "power2.out" }
            );
          }

          if (flipped >= compliments.length) {
            const final = $("#final-compliment");
            if (window.gsap && !prefersReducedMotion()) {
              gsap.to(final, { opacity: 1, y: 0, duration: 1, delay: 0.3 });
            } else {
              final.style.opacity = "1";
            }
          }
        };

        card.addEventListener("click", flip);
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            flip();
          }
        });

        grid.appendChild(card);
      });

      if (window.gsap && !prefersReducedMotion()) {
        gsap.from(".compliment-card", {
          opacity: 0,
          y: 40,
          duration: 0.7,
          stagger: 0.06,
          delay: 0.3,
          ease: "power2.out",
        });
      }
    });
  </script>
</body>
</html>
